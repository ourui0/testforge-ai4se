stages: [test, build]

unit-test:
  stage: test
  image: python:3.12
  script:
    - python -m pip install -e ".[dev]"
    - python -m pytest tests/unit tests/integration/test_mock_loop.py tests/e2e -m "not docker"

package:
  stage: build
  image: python:3.12
  script:
    - python -m pip install build
    - python -m build
  artifacts:
    paths: [dist/]
