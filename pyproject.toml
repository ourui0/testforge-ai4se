[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "testforge-harness"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
  "keyring>=25,<26",
  "openai>=1.40,<3",
  "docker>=7,<8",
]

[project.optional-dependencies]
dev = ["build>=1.2,<2", "httpx>=0.27,<1", "pytest>=8,<9", "pytest-cov>=5,<7", "pytest-json-report>=1.5,<2", "mutmut>=3,<4", "ruff>=0.6,<1", "mypy>=1.11,<2"]

[project.scripts]
testforge = "testforge.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/testforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp --ignore=tests/fixtures -m 'not docker'"
markers = [
  "docker: tests that require a running Docker daemon and pre-built image",
]
